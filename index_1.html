<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="UnTocco">
<meta name="theme-color" content="#e7ebf0">
<title>UnTocco — La tua voce</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  [hidden]{display:none!important}
  img{max-width:100%}
  :root{
    --ground:#e7ebf0;
    --frame:#c3cad4;
    --panel:#ffffff;
    --panel-sunken:#f1f4f8;
    --ink:#182231;
    --ink-soft:#516074;
    --hair:#d7dde5;
    --neutral:#33506e;
    --neutral-ink:#ffffff;
    --yes:#127a3e;
    --yes-ink:#ffffff;
    --no:#bd3124;
    --no-ink:#ffffff;
    --maybe:#b9820a;
    --maybe-ink:#20170a;
    --urgent:#d21f2c;
    --urgent-ink:#ffffff;
    --shadow:0 2px 0 rgba(24,34,49,.14),0 10px 24px rgba(24,34,49,.12);
    --shadow-press:0 1px 0 rgba(24,34,49,.18);
    --r:20px;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --ground:#0c1015;
      --frame:#04070a;
      --panel:#1b2330;
      --panel-sunken:#141b26;
      --ink:#eef2f7;
      --ink-soft:#9fb0c4;
      --hair:#2c3849;
      --neutral:#5c82ad;
      --neutral-ink:#08111c;
      --yes:#2ea45f;
      --yes-ink:#04140a;
      --no:#e5584c;
      --no-ink:#170606;
      --maybe:#e0a92c;
      --maybe-ink:#1a1305;
      --urgent:#f24a55;
      --urgent-ink:#1a0406;
      --shadow:0 2px 0 rgba(0,0,0,.4),0 12px 28px rgba(0,0,0,.45);
      --shadow-press:0 1px 0 rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0c1015;
    --frame:#04070a;
    --panel:#1b2330;
    --panel-sunken:#141b26;
    --ink:#eef2f7;
    --ink-soft:#9fb0c4;
    --hair:#2c3849;
    --neutral:#5c82ad;
    --neutral-ink:#08111c;
    --yes:#2ea45f;
    --yes-ink:#04140a;
    --no:#e5584c;
    --no-ink:#170606;
    --maybe:#e0a92c;
    --maybe-ink:#1a1305;
    --urgent:#f24a55;
    --urgent-ink:#1a0406;
    --shadow:0 2px 0 rgba(0,0,0,.4),0 12px 28px rgba(0,0,0,.45);
    --shadow-press:0 1px 0 rgba(0,0,0,.5);
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
    background:var(--ground);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    margin:0;padding:0;
    height:100vh;height:100dvh;overflow:hidden;
  }
  .wrap{max-width:none;margin:0;height:100%}
  /* barra comandi minima dentro l'app */
  .topbar{display:flex;justify-content:flex-end;gap:8px}
  .theme-toggle{
    font-family:inherit;font-size:13px;color:var(--ink-soft);
    background:var(--panel);border:1px solid var(--hair);border-radius:999px;
    padding:6px 14px;cursor:pointer;
  }
  .theme-toggle:hover{color:var(--ink)}
  .voice-wrap{display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft);
    background:var(--panel);border:1px solid var(--hair);border-radius:999px;padding:4px 10px 4px 12px}
  .voice-select{
    font-family:inherit;font-size:13px;color:var(--ink);background:transparent;
    border:none;cursor:pointer;max-width:150px;padding:2px 4px;
  }
  .voice-select:focus-visible{outline:3px solid var(--neutral);outline-offset:2px;border-radius:6px}

  /* app a tutto schermo (niente cornice) */
  .ipad{background:none;padding:0;box-shadow:none;position:relative;height:100%}
  .ipad::before{display:none}
  .screen{
    background:var(--ground);
    border-radius:0;
    padding:14px;
    display:flex;flex-direction:column;gap:12px;
    height:100%;
    position:relative;
    overflow:hidden;
  }

  /* Compose bar */
  .compose{
    display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:stretch;
  }
  .btn-clear{background:var(--panel);border:2px solid var(--no);color:var(--no);min-width:92px}
  .btn-clear .ico{font-size:26px;color:var(--no)}
  .btn-clear .lab{font-size:13px;letter-spacing:.2px}
  .phrase{
    background:var(--panel);border:1px solid var(--hair);border-radius:var(--r);
    padding:16px 20px;min-height:78px;display:flex;flex-direction:column;justify-content:center;
    box-shadow:var(--shadow-press);cursor:pointer;position:relative;
    -webkit-tap-highlight-color:transparent;
  }
  .phrase:active{transform:translateY(1px)}
  .phrase:focus-visible{outline:4px solid var(--neutral);outline-offset:3px}
  .phrase .hint{
    position:absolute;top:10px;right:16px;display:flex;align-items:center;gap:6px;
    font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-soft);
  }
  .phrase .hint .ico{font-size:20px}
  .phrase .status{
    font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
    color:var(--maybe);display:none;margin-bottom:4px;
  }
  .phrase.preparing .status{display:block;animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.4}}
  .phrase .text{font-size:26px;font-weight:700;line-height:1.15;text-wrap:balance}
  .phrase .text.placeholder{color:var(--ink-soft);font-weight:400}

  .btn{
    font-family:inherit;border:none;border-radius:var(--r);cursor:pointer;
    font-weight:700;color:var(--ink);background:var(--panel);
    box-shadow:var(--shadow);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    padding:14px;transition:transform .05s ease, box-shadow .05s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:translateY(2px);box-shadow:var(--shadow-press)}
  .btn:focus-visible{outline:4px solid var(--neutral);outline-offset:3px}
  .btn .ico{font-size:30px;line-height:1}
  .btn .lab{font-size:16px;letter-spacing:.3px}

  .btn-speak{background:var(--neutral);color:var(--neutral-ink);min-width:150px}
  .btn-speak .ico{font-size:34px}
  .btn-speak .lab{font-size:22px;letter-spacing:.5px}
  .btn-stop{background:var(--panel-sunken);min-width:96px}

  /* Predictive words during composition (home) */
  .home-suggests{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
  .hsugg{min-height:54px;background:var(--panel);flex-direction:row}
  .hsugg .lab{font-size:18px;font-weight:700;letter-spacing:.2px}
  .hsugg[disabled]{visibility:hidden}

  /* Intentions */
  .intentions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .intent{min-height:104px}
  .intent .ico{font-size:38px}
  .intent .lab{font-size:22px;letter-spacing:.5px}
  .intent.yes{background:var(--yes);color:var(--yes-ink)}
  .intent.maybe{background:var(--maybe);color:var(--maybe-ink)}
  .intent.no{background:var(--no);color:var(--no-ink)}

  /* Middle: contexts + side */
  .middle{display:grid;grid-template-columns:1fr 210px;gap:14px;flex:1;min-height:0}
  .contexts{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:12px}
  .ctx .ico{font-size:40px}
  .ctx .lab{font-size:17px}
  .side{display:grid;grid-template-rows:1fr 1fr;gap:12px}
  .btn-mode{background:var(--panel);border:2px solid var(--neutral)}
  .btn-mode .ico{font-size:34px;color:var(--neutral)}
  .btn-mode .lab{font-size:16px}
  .btn-help{background:var(--urgent);color:var(--urgent-ink)}
  .btn-help .ico{font-size:40px}
  .btn-help .lab{font-size:22px;letter-spacing:1px}

  /* Permanent quick bar */
  .quickbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .quick{min-height:66px;background:var(--panel-sunken)}
  .quick .lab{font-size:15px;letter-spacing:.3px}
  .quick .ico{font-size:22px}

  /* Context overlay */
  .overlay{
    position:absolute;inset:0;background:var(--ground);
    padding:16px;display:none;flex-direction:column;gap:12px;z-index:5;
  }
  .overlay.open{display:flex}
  .ovhead{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
  .btn-back{background:var(--panel);min-height:66px;min-width:150px;flex-direction:row;gap:10px}
  .btn-back .ico{font-size:26px}
  .btn-back .lab{font-size:18px}
  .ovtitle{font-size:24px;font-weight:700;display:flex;align-items:center;gap:12px}
  .ovtitle .em{font-size:30px}
  .ovgrid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:12px;flex:1}
  .need{background:var(--panel);min-height:96px}
  .need .ico{font-size:34px}
  .need .lab{font-size:18px;text-wrap:balance}
  .need small{display:block;font-weight:400;color:var(--ink-soft);font-size:13px;margin-top:2px}

  /* Yes/No question mode */
  .yesno{
    position:absolute;inset:0;background:var(--ground);z-index:6;
    display:none;flex-direction:column;padding:16px;gap:12px;
  }
  .yesno.open{display:flex}
  .yesno .prompt{
    text-align:center;font-size:20px;color:var(--ink-soft);font-weight:700;
    letter-spacing:.4px;padding-top:2px;
  }
  .yesno .pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1}
  .yesno .big{border-radius:24px}
  .yesno .big .ico{font-size:96px}
  .yesno .big .lab{font-size:44px;letter-spacing:1px}
  .yesno .big.yes{background:var(--yes);color:var(--yes-ink)}
  .yesno .big.no{background:var(--no);color:var(--no-ink)}
  .yesno .foot{display:grid;grid-template-columns:1fr auto;gap:12px}
  .yesno .maybe-row{background:var(--maybe);color:var(--maybe-ink);min-height:78px;flex-direction:row;gap:12px}
  .yesno .maybe-row .ico{font-size:30px}
  .yesno .maybe-row .lab{font-size:24px}
  .yesno .close{background:var(--panel);min-height:78px;min-width:150px;flex-direction:row;gap:10px}
  .yesno .close .ico{font-size:24px}
  .yesno .close .lab{font-size:18px}

  /* Keyboard */
  .keyboard{
    position:absolute;inset:0;background:var(--ground);z-index:7;
    display:none;flex-direction:column;padding:14px;gap:10px;
  }
  .keyboard.open{display:flex}
  .kb-top{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:stretch}
  .kb-field{
    background:var(--panel);border:1px solid var(--hair);border-radius:16px;
    padding:12px 18px;display:flex;align-items:center;min-height:64px;
    font-size:24px;font-weight:700;box-shadow:var(--shadow-press);
  }
  .kb-field .caret{display:inline-block;width:3px;height:26px;background:var(--neutral);margin-left:2px;animation:blink 1s step-end infinite}
  @keyframes blink{50%{opacity:0}}
  .kb-field.empty{color:var(--ink-soft);font-weight:400}
  .kb-speak{min-width:130px;background:var(--neutral);color:var(--neutral-ink)}
  .kb-speak .ico{font-size:28px}.kb-speak .lab{font-size:18px}
  .suggests{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .sugg{min-height:56px;background:var(--panel-sunken);flex-direction:row}
  .sugg .lab{font-size:19px;font-weight:700}
  .sugg:empty{visibility:hidden}
  .freq{
    width:100%;background:var(--panel-sunken);border:2px dashed var(--neutral);
    min-height:58px;flex-direction:row;gap:12px;justify-content:flex-start;padding:10px 18px;
  }
  .freq .ico{font-size:22px;color:var(--neutral)}
  .freq .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);font-weight:700;white-space:nowrap}
  .freq .lab{font-size:20px;font-weight:700;text-align:left;text-wrap:balance}
  .kb-rows{display:flex;flex-direction:column;gap:8px;flex:1;justify-content:center}
  .kb-row{display:flex;gap:8px;justify-content:center}
  .key{
    flex:1;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);
    font-family:inherit;font-weight:700;font-size:26px;color:var(--ink);
    border:none;cursor:pointer;min-height:60px;max-width:88px;
    display:flex;align-items:center;justify-content:center;
    transition:transform .05s ease,box-shadow .05s ease;-webkit-tap-highlight-color:transparent;
  }
  .key:active{transform:translateY(2px);box-shadow:var(--shadow-press)}
  .key:focus-visible{outline:4px solid var(--neutral);outline-offset:2px}
  .kb-actions{display:grid;grid-template-columns:1.2fr 1fr 1fr auto auto;gap:10px}
  .kb-actions .btn{min-height:64px;flex-direction:row;gap:10px}
  .k-space{background:var(--panel-sunken)}
  .k-back,.k-backword{background:var(--maybe);color:var(--maybe-ink)}
  .k-back .ico,.k-backword .ico{font-size:24px}
  .k-back .lab,.k-backword .lab{font-size:16px}
  .k-clear{background:var(--panel);border:2px solid var(--no);color:var(--no)}
  .k-clear .lab{font-size:15px}
  .k-close{background:var(--panel);min-width:120px}
  .k-close .lab{font-size:16px}
  /* left-hand mode mirrors the action row so the big keys sit under the working hand */
  .keyboard.left .kb-actions{direction:rtl}
  .keyboard.left .kb-actions .btn{direction:ltr}
  /* Confirm dialog (sostituisce window.confirm, bloccato in sandbox) */
  .confirm{
    position:absolute;inset:0;z-index:9;display:none;
    align-items:center;justify-content:center;padding:24px;
    background:rgba(10,15,22,.55);
  }
  .confirm.open{display:flex}
  .confirm-box{
    background:var(--panel);border-radius:24px;box-shadow:var(--shadow);
    padding:26px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:20px;
    border:1px solid var(--hair);
  }
  .confirm-msg{font-size:26px;font-weight:700;text-align:center;text-wrap:balance}
  .confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .confirm-actions .btn{min-height:88px;flex-direction:row;gap:10px}
  .c-cancel{background:var(--panel-sunken)}
  .c-cancel .lab{font-size:20px}
  .c-ok{background:var(--no);color:var(--no-ink)}
  .c-ok .ico{font-size:26px}
  .c-ok .lab{font-size:20px;letter-spacing:.3px}
  .hand-toggle{
    position:absolute;top:14px;right:14px;z-index:2;
    font-family:inherit;font-size:13px;color:var(--ink-soft);
    background:var(--panel);border:1px solid var(--hair);border-radius:999px;padding:6px 12px;cursor:pointer;
  }

  .note{margin-top:16px;color:var(--ink-soft);font-size:13.5px;line-height:1.6;max-width:74ch}
  .note b{color:var(--ink)}
  .legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;font-size:13px;color:var(--ink-soft)}
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .dot{width:13px;height:13px;border-radius:4px;display:inline-block}
  .voice-off{display:none}
  body.no-voice .voice-off{display:inline}

  @media (max-width:720px){
    .screen{aspect-ratio:auto;min-height:0}
    .middle{grid-template-columns:1fr}
    .side{grid-template-rows:auto auto;grid-template-columns:1fr 1fr}
    .contexts{grid-template-columns:repeat(2,1fr)}
    .compose{grid-template-columns:1fr auto}
    .btn-stop{grid-column:2}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="ipad" role="group" aria-label="UnTocco">
    <div class="screen">

      <div class="topbar">
        <label class="voice-wrap"><span aria-hidden="true">&#128264;</span>
          <select class="voice-select" id="voiceSelect" aria-label="Scegli la voce"></select>
        </label>
        <button class="theme-toggle" id="themeBtn" type="button">Tema</button>
      </div>

      <!-- COMPOSE -->
      <div class="compose">
        <div class="phrase" id="phrase" role="button" tabindex="0" aria-label="Tocca per scrivere con la tastiera">
          <div class="hint" aria-hidden="true"><span class="ico">&#9000;</span>Tocca per scrivere</div>
          <div class="status">Sto preparando la risposta&hellip;</div>
          <div class="text placeholder" id="phraseText">Tocca qui per scrivere&hellip;</div>
        </div>
        <button class="btn btn-speak" type="button" data-speak="__phrase__" aria-label="Parla">
          <span class="ico" aria-hidden="true">&#128264;</span><span class="lab">PARLA</span>
        </button>
        <button class="btn btn-stop" type="button" id="stopBtn" aria-label="Ferma la voce">
          <span class="ico" aria-hidden="true">&#9632;</span><span class="lab">STOP</span>
        </button>
        <button class="btn btn-clear" type="button" id="clearHomeBtn" aria-label="Cancella tutta la frase">
          <span class="ico" aria-hidden="true">&#128465;</span><span class="lab">CANCELLA<br>TUTTO</span>
        </button>
      </div>

      <!-- Parole predittive in composizione -->
      <div class="home-suggests" id="homeSuggests" hidden></div>

      <!-- INTENTIONS -->
      <div class="intentions">
        <button class="btn intent yes" type="button" data-say="Sì">
          <span class="ico" aria-hidden="true">&#10003;</span><span class="lab">SÌ</span>
        </button>
        <button class="btn intent maybe" type="button" data-say="Non lo so">
          <span class="ico" aria-hidden="true">?</span><span class="lab">NON SO</span>
        </button>
        <button class="btn intent no" type="button" data-say="No">
          <span class="ico" aria-hidden="true">&#10007;</span><span class="lab">NO</span>
        </button>
      </div>

      <!-- MIDDLE -->
      <div class="middle">
        <div class="contexts" id="contexts"></div>
        <div class="side">
          <button class="btn btn-mode" type="button" id="modeBtn">
            <span class="ico" aria-hidden="true">&#9863;</span><span class="lab">DOMANDE<br>SÌ / NO</span>
          </button>
          <button class="btn btn-help" type="button" data-say="Ho bisogno di aiuto">
            <span class="ico" aria-hidden="true">&#9888;</span><span class="lab">AIUTO</span>
          </button>
        </div>
      </div>

      <!-- QUICK BAR -->
      <div class="quickbar">
        <button class="btn quick" type="button" data-say="Aspetta"><span class="ico" aria-hidden="true">&#9995;</span><span class="lab">ASPETTA</span></button>
        <button class="btn quick" type="button" data-say="Fermati"><span class="ico" aria-hidden="true">&#9995;</span><span class="lab">FERMATI</span></button>
        <button class="btn quick" type="button" data-say="Non ho capito"><span class="ico" aria-hidden="true">&#10068;</span><span class="lab">NON HO CAPITO</span></button>
        <button class="btn quick" type="button" data-say="Lasciami finire"><span class="ico" aria-hidden="true">&#9998;</span><span class="lab">LASCIAMI FINIRE</span></button>
      </div>

      <!-- CONTEXT OVERLAY -->
      <div class="overlay" id="overlay" role="dialog" aria-label="Bisogni del contesto">
        <div class="ovhead">
          <button class="btn btn-back" type="button" id="backBtn">
            <span class="ico" aria-hidden="true">&#8592;</span><span class="lab">INDIETRO</span>
          </button>
          <div class="ovtitle" id="ovtitle"></div>
        </div>
        <div class="ovgrid" id="ovgrid"></div>
      </div>

      <!-- YES/NO MODE -->
      <div class="yesno" id="yesno" role="dialog" aria-label="Modalità domande sì o no">
        <div class="prompt">L&rsquo;altra persona ti fa domande &mdash; rispondi con un tocco</div>
        <div class="pair">
          <button class="btn big yes" type="button" data-say="Sì">
            <span class="ico" aria-hidden="true">&#10003;</span><span class="lab">SÌ</span>
          </button>
          <button class="btn big no" type="button" data-say="No">
            <span class="ico" aria-hidden="true">&#10007;</span><span class="lab">NO</span>
          </button>
        </div>
        <div class="foot">
          <button class="btn maybe-row" type="button" data-say="Non lo so">
            <span class="ico" aria-hidden="true">?</span><span class="lab">NON SO</span>
          </button>
          <button class="btn close" type="button" id="closeYesno">
            <span class="ico" aria-hidden="true">&#8592;</span><span class="lab">CHIUDI</span>
          </button>
        </div>
      </div>

      <!-- KEYBOARD -->
      <div class="keyboard" id="keyboard" role="dialog" aria-label="Tastiera accessibile">
        <button class="hand-toggle" type="button" id="handBtn">Mano: destra</button>
        <div class="kb-top">
          <div class="kb-field empty" id="kbField">Scrivi qui&hellip;</div>
          <button class="btn kb-speak" type="button" id="kbSpeak">
            <span class="ico" aria-hidden="true">&#128264;</span><span class="lab">PARLA</span>
          </button>
        </div>
        <div class="suggests" id="suggests"></div>
        <button class="btn freq" type="button" id="freqBtn" aria-label="Usa la frase più usata">
          <span class="ico" aria-hidden="true">&#9733;</span>
          <span class="eyebrow">Più usata</span>
          <span class="lab">&hellip;</span>
        </button>
        <div class="kb-rows" id="kbRows"></div>
        <div class="kb-actions">
          <button class="btn k-space" type="button" id="kSpace"><span class="lab">SPAZIO</span></button>
          <button class="btn k-back" type="button" id="kBack"><span class="ico" aria-hidden="true">&#9003;</span><span class="lab">CANCELLA<br>LETTERA</span></button>
          <button class="btn k-backword" type="button" id="kBackWord"><span class="ico" aria-hidden="true">&#9003;</span><span class="lab">CANCELLA<br>PAROLA</span></button>

"rinnovato","risolve","sacerdoti","scarpa","sceso","scolastici","sega","sentiva","sesta","sicure","simpatica","sostenuta","sposo","spostamento","spunto","stone","stradali","strega","sun","talenti","tariffa","telecom","tenersi","tensioni","tommy","tornò","trauma","triennale","tumori","ubriaco","ugo","umbria","victoria","vizio","vuoti","welfare","abbandonati","acquisizione","adige","adriano","andasse","andremo","animato","apprendimento","arbitro","au","bandiere","banner","barriere","basilicata","bastava","battesimo","beccato","bon","brand","buenos","cammina","carla","caserta","casini","classiche","collaborato","collezioni","compassione","comprensibile","compro","concedere","concentrato","conformità","consapevoli","contadino","contenenti","controversia","corde","credibilità","cross","cuneo","defunto","dell'ultima","determina","diplomatico","direttori","discreto","distribuito","donald","dosi","drago","elettriche","elettronico","emissione","esca","esporre","eugenio","farmacia","fascio","fast","filmati","fondamento","fornitura","freno","funzionario","gialla","giustificazione","gomme","hacker","hollywood","ignoranti","im","incapaci","incarichi","incredibili","indigeni","indubbiamente","inflazione","insegnamenti","installato","interpretazioni","invernale","jordan","ligure","lobby","lu","may","meme","milanesi","missili","mondadori","mostrando","napoletana","nodi","notturno","now","particolar","pen","permessi","piombo","point","polso","poltrona","pr","prefetto","presenze","pretesto","proviamo","pulizie","punito","ra","raggiungimento","regge","renda","rendimento","repertorio","repressione","ricevuti","richiamato","ridicola","ripete","rispose","rituale"];
  vocab = vocab.filter(function(w,i){ return vocab.indexOf(w)===i; }); // dedup

  // Concordanza dopo un articolo/determinante: solo nomi del genere giusto
  var nounsM=["bagno","caffè","medico","letto","telefono","bicchiere","cibo","cuscino",
    "dolore","dottore","pane","latte","cuore","respiro","braccio","piede","tavolo","aiuto",
    "giorno","naso","petto","assistente","cellulare","giornale"];
  var nounsF=["acqua","medicina","luce","porta","finestra","doccia","coperta","sedia",
    "poltrona","mano","gamba","testa","bocca","gola","pancia","schiena","febbre","tosse",
    "nausea","stanza","cucina","sete","fame","paura","televisione","coperta"];
  nounsM=nounsM.filter(function(w,i){return nounsM.indexOf(w)===i;});
  nounsF=nounsF.filter(function(w,i){return nounsF.indexOf(w)===i;});
  var detMasc={"il":1,"lo":1,"un":1,"l'":1,"questo":1,"quello":1,"del":1,"dello":1,"nel":1,"al":1};
  var detFem={"la":1,"una":1,"un'":1,"questa":1,"quella":1,"della":1,"nella":1,"alla":1};

  // Quando la frase esprime la volontà di contattare qualcuno, proponi i NOMI:
  // prima i familiari, poi gli altri contatti. (Nel mockup sono nomi d'esempio;
  // nell'app verrebbero dalla rubrica personale con foto — §7.)
  var contacts=["mamma","papà","mia figlia","mio figlio","mia moglie","mio marito","il medico","l'assistente"];
  var callVerbs={"chiama":1,"chiamare":1,"chiamate":1,"chiami":1,"chiamo":1,"chiamami":1,
    "telefona":1,"telefonare":1,"telefono":1,"parla":1,"parlare":1,"parlo":1,
    "videochiama":1,"videochiamare":1,"senti":1,"sentire":1,"chiamala":1,"chiamalo":1};
  var linkWords={"a":1,"con":1,"al":1,"alla":1,"allo":1,"ai":1,"alle":1};
  function wantsName(words){
    var last=words[words.length-1];
    if(callVerbs[last]) return true;
    if(linkWords[last] && words.length>=2 && callVerbs[words[words.length-2]]) return true;
    return false;
  }
  var contactUse=LS.get("contacts", {}); // nome -> quante volte scelto (personalizzazione)
  function orderedContacts(){
    var idx={}; contacts.forEach(function(n,i){ idx[n]=i; });
    return contacts.slice().sort(function(a,b){
      var d=(contactUse[b]||0)-(contactUse[a]||0);   // più usato prima
      return d!==0 ? d : idx[a]-idx[b];              // a parità, familiari prima
    });
  }
  function namesFor(words){
    var last=words[words.length-1];
    var list=orderedContacts();
    if(linkWords[last]) return list;                             // preposizione già scritta
    if(/^parl/.test(last)) return list.map(function(n){return "con "+n;});
    if(/^telefon/.test(last)) return list.map(function(n){return "a "+n;});
    return list;                                                 // chiama / videochiama / senti
  }

  function byPrefix(pool, frag){
    return pool.filter(function(w){ return w.indexOf(frag)===0 && w!==frag; });
  }
  function predict(t){
    if(t.replace(/\s+$/,"")===""){ return starters; }        // start of sentence
    if(/\s$/.test(t)){                                        // just completed a word
      var words=t.trim().toLowerCase().replace(/[.,!?;:]/g,"").split(/\s+/);
      if(wantsName(words)){ return namesFor(words); }         // intenzione di contattare -> nomi
      var prev=words[words.length-1];
      if(nextWord[prev]) return nextWord[prev];
      if(detMasc[prev]) return nounsM;                        // dopo "il/lo/un…" -> nomi maschili
      if(detFem[prev]) return nounsF;                         // dopo "la/una…" -> nomi femminili
      return nextWord["_next"];
    }
    // still typing a word: completa solo con parole sensate per il contesto
    var toks=t.split(/\s+/);
    var frag=toks[toks.length-1].toLowerCase();
    var prev=toks.length>=2 ? toks[toks.length-2].toLowerCase().replace(/[.,!?;:]/g,"") : "";
    if(detMasc[prev]) return byPrefix(nounsM, frag);          // dopo un articolo maschile
    if(detFem[prev]) return byPrefix(nounsF, frag);           // dopo un articolo femminile
    return byPrefix(vocab, frag);
  }
  function suggestFor(){ return predict(kbText); }

  // --- predictive words on the HOME screen, during composition ---
  function appendToPhrase(w){
    var isFirst = current.replace(/\s+$/,"")==="";
    var word = isFirst ? w.charAt(0).toUpperCase()+w.slice(1) : w;
    var base = current;
    if(base==="" || /\s$/.test(base)) current = base+word+" ";
    else current = base+" "+word+" ";
    var b=w.toLowerCase().replace(/^(con|a|al|alla|allo|ai|alle)\s+/,"");
    if(contacts.indexOf(b)>=0){ contactUse[b]=(contactUse[b]||0)+1; LS.set("contacts",contactUse); }
    setPhrase(current);        // aggiorna campo e ri-renderizza i suggerimenti
    preparing(true);           // frase pronta ma non ancora pronunciata
  }
  function renderHomeSuggests(){
    var box=document.getElementById("homeSuggests");
    if(!box) return;
    var t=current.replace(/\s+$/,"");
    if(t===""){ box.hidden=true; box.innerHTML=""; return; }
    var list=predict(t+" ");                                  // sempre come "parola completata"
    box.innerHTML="";
    if(!list.length){ box.hidden=true; return; }
    box.hidden=false;
    for(var i=0;i<6;i++){
      var bt=document.createElement("button");
      bt.className="btn hsugg"; bt.type="button";
      var w=list[i]||"";
      if(w){ bt.innerHTML='<span class="lab">'+w+'</span>';
        (function(x){ bt.addEventListener("click",function(){ appendToPhrase(x); }); })(w);
      } else { bt.disabled=true; }
      box.appendChild(bt);
    }
  }
  function insertWord(w){
    var before=kbText.replace(/\S*$/,"");                     // text before the trailing partial
    var isFirst=before.trim()==="";
    var word=isFirst ? w.charAt(0).toUpperCase()+w.slice(1) : w;
    if(kbText==="" || /\s$/.test(kbText)){ kbText=kbText+word+" "; }
    else { kbText=before+word+" "; }
    // personalizzazione: se ho inserito un contatto, conto quante volte è scelto
    var base=w.toLowerCase().replace(/^(con|a|al|alla|allo|ai|alle)\s+/,"");
    if(contacts.indexOf(base)>=0){ contactUse[base]=(contactUse[base]||0)+1; LS.set("contacts",contactUse); }
    renderKb();
  }
  function renderSuggests(){
    var list=suggestFor();
    var before=kbText.replace(/\S*$/,"");
    var isFirst=before.trim()==="";
    suggests.innerHTML="";
    for(var i=0;i<SUGG;i++){
      var b=document.createElement("button");
      b.className="btn sugg"; b.type="button";
      var word=list[i]||"";
      if(word){
        var disp=isFirst ? word.charAt(0).toUpperCase()+word.slice(1) : word;
        b.innerHTML='<span class="lab">'+disp+'</span>';
        (function(w){ b.addEventListener("click",function(){ insertWord(w); }); })(word);
      }
      suggests.appendChild(b);
    }
  }
  function renderField(){
    if(kbText===""){ kbField.textContent="Scrivi qui…"; kbField.classList.add("empty"); }
    else {
      kbField.classList.remove("empty");
      kbField.textContent=kbText;
      var c=document.createElement("span"); c.className="caret"; kbField.appendChild(c);
    }
  }
  function renderKb(){ renderField(); renderSuggests(); }
  function buildKeys(){
    kbRows.innerHTML="";
    rows.forEach(function(r){
      var row=document.createElement("div"); row.className="kb-row";
      r.split("").forEach(function(ch){
        var k=document.createElement("button");
        k.className="key"; k.type="button"; k.textContent=ch;
        k.addEventListener("click",function(){ kbText+=ch.toLowerCase(); renderKb(); });
        row.appendChild(k);
      });
      kbRows.appendChild(row);
    });
  }
  buildKeys();
  function openKeyboard(){
    kbText = current || "";
    renderKb(); renderFreq(); keyboard.classList.add("open");
  }
  document.getElementById("freqBtn").addEventListener("click", function(){
    var p=topPhrase();
    if(p){ kbText=p+" "; renderKb(); }
  });
  phrase.addEventListener("click", openKeyboard);
  phrase.addEventListener("keydown", function(e){
    if(e.key==="Enter" || e.key===" "){ e.preventDefault(); openKeyboard(); }
  });
  document.getElementById("kSpace").addEventListener("click",function(){ kbText+=" "; renderKb(); });
  document.getElementById("kBack").addEventListener("click",function(){ kbText=kbText.slice(0,-1); renderKb(); });
  document.getElementById("kBackWord").addEventListener("click",function(){
    // remove trailing spaces, then the last word
    kbText=kbText.replace(/\s+$/,"").replace(/\S+$/,"");
    renderKb();
  });
  document.getElementById("kClear").addEventListener("click",function(){
    if(!kbText){ return; }
    askConfirm("Cancellare tutto il testo?", function(){ kbText=""; renderKb(); });
  });
  document.getElementById("kbSpeak").addEventListener("click",function(){
    var t=kbText.trim();
    if(t){ setPhrase(t); say(t); recordPhrase(t); preparing(false); keyboard.classList.remove("open"); }
  });
  document.getElementById("kClose").addEventListener("click",function(){
    var t=kbText.trim();
    if(t){ setPhrase(t); preparing(true); } // staged but not yet spoken
    keyboard.classList.remove("open");
  });
  document.getElementById("handBtn").addEventListener("click",function(){
    var left=keyboard.classList.toggle("left");
    this.textContent = left ? "Mano: sinistra" : "Mano: destra";
  });

  setPhrase("");
  renderFreq();
})();
</script>
